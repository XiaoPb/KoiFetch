# Alembic configuration for the Koi Fetch backend.
#
# The database URL is NEVER hardcoded here: alembic/env.py resolves it at
# runtime from the DATABASE_URL environment variable when set, otherwise from
# the typed application settings (get_settings().database_url).
#
# Working invocations (all equivalent, thanks to %(here)s-relative paths):
#   from backend/ : ..\.venv\Scripts\python.exe -m alembic upgrade head
#   from repo root: ..\.venv\Scripts\python.exe -m alembic -c backend/alembic.ini upgrade head
#   in the image : alembic upgrade head   (WORKDIR /app; alembic.ini + alembic/ are copied)

[alembic]
# %(here)s resolves to the directory containing this ini file, so the script
# location and sys.path entry work from any working directory.
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os

# template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
