# Koi Fetch local stack: backend (FastAPI API + auth + orchestration + the
# built frontend served at "/") and worker (background parse / download /
# cleanup jobs).
#
# There is no container-internal Nginx anymore: the backend image builds the
# frontend and serves it at "/", so /api and /ws are same-origin and need no
# reverse proxy (production deployments sit behind their own external proxy).
# Host port 8000 therefore exposes the API AND the SPA on one origin.
#
# Workflow: copy .env.example to .env, adjust values, then
# `docker compose up --build`. Both services share one Python image
# (./backend/Dockerfile, multi-stage: a Node stage builds the frontend, the
# Python stage runs backend + static serving) and differ only in their startup
# command:
#   - backend:  `alembic upgrade head && python -m app.infrastructure.seed &&
#               uvicorn ...`  (migrations, then the idempotent admin seed, then API)
#   - worker:   `python -m app.workers.main`           (worker entrypoint module)
#
# Storage layout: SQLite under ./data/db, Bubble (temporary) under
# ./data/bubble, Pond (permanent) under ./data/pond — all bind-mounted into the
# containers and kept out of version control (see .gitignore).

name: koi-fetch

services:
  backend:
    # The build context is the repository root: the multi-stage Dockerfile
    # builds the frontend from ./frontend and copies the dist into the image.
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: koi-fetch-backend:local
    env_file: .env
    environment:
      # Per PRD deployment; falls back to Asia/Shanghai even if .env omits TZ.
      TZ: ${TZ:-Asia/Shanghai}
      # The image copies the built frontend to /app/static (see Dockerfile);
      # override the native default (frontend/dist) so the backend serves it.
      FRONTEND_DIST_PATH: /app/static
      COOKIE_ENCRYPTION_KEY: ${COOKIE_ENCRYPTION_KEY:?COOKIE_ENCRYPTION_KEY must be set}
    volumes:
      - ./data/db:/app/data/db
      - ./data/bubble:/app/data/bubble
      - ./data/pond:/app/data/pond
    command:
      - sh
      - -c
      - alembic upgrade head && python -m app.infrastructure.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000
    # One origin for everything: the SPA at / and the API/WS on /api and /ws.
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      # Runs the app's readiness probe (app/health.py): /api/health always
      # returns 200 and reports readiness in the body, so the probe requires
      # code == 0 — `depends_on: service_healthy` on the worker therefore
      # reflects storage readiness, not just a live HTTP server.
      test:
        - CMD
        - python
        - -m
        - app.health
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: koi-fetch-backend:local
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      COOKIE_ENCRYPTION_KEY: ${COOKIE_ENCRYPTION_KEY:?COOKIE_ENCRYPTION_KEY must be set}
    volumes:
      - ./data/db:/app/data/db
      - ./data/bubble:/app/data/bubble
      - ./data/pond:/app/data/pond
    command:
      - python
      - -m
      - app.workers.main
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
