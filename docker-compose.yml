# Koi Fetch local stack: frontend (Nginx serving the React build), backend
# (FastAPI API / auth / orchestration), worker (background parse / download /
# cleanup jobs).
#
# Workflow: copy .env.example to .env, adjust values, then
# `docker compose up --build`. The backend and worker share one Python image
# (./backend/Dockerfile) and differ only in their startup command:
#   - backend:  `alembic upgrade head && uvicorn ...`  (migrations are explicit)
#   - worker:   `python -m app.workers.main`           (worker entrypoint module)
# Both target modules arrive in later tasks (Alembic, worker); the commands
# below define their shape now so the stack boots end-to-end once they land.
#
# Storage layout: SQLite under ./data/db, Bubble (temporary) under
# ./data/bubble, Pond (permanent) under ./data/pond — all bind-mounted into the
# containers and kept out of version control (see .gitignore).

name: koi-fetch

services:
  backend:
    build:
      context: ./backend
    image: koi-fetch-backend:local
    env_file: .env
    environment:
      # Per PRD deployment; falls back to Asia/Shanghai even if .env omits TZ.
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/db:/app/data/db
      - ./data/bubble:/app/data/bubble
      - ./data/pond:/app/data/pond
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: ./backend
    image: koi-fetch-backend:local
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/db:/app/data/db
      - ./data/bubble:/app/data/bubble
      - ./data/pond:/app/data/pond
    command:
      - python
      - -m
      - app.workers.main
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: koi-fetch-frontend:local
    # 5173 matches the local-dev CORS origin (http://localhost:5173) so the
    # containerized frontend is reachable at the same origin as the Vite dev
    # server. Nginx proxies /api and /ws to the backend service.
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
