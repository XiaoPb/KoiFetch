name: CI

# Continuous integration: run the full backend + frontend test suites and
# verify the production Docker image builds. Runs on every push to main and
# on pull requests; the release workflow also calls this file as a reusable
# workflow (`workflow_call`) so a tag-triggered release only publishes after
# the same gates pass.
#
# Gates mirror the RELEASE-CHECKLIST acceptance rows:
#   - backend:  `python -m pytest backend/tests` (full engine deps installed)
#   - frontend: `npm test` (vitest) + `npm run build` (tsc + vite build)
#   - image:    `docker build -f backend/Dockerfile .` (multi-stage, no push)

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Full dependency install (incl. git-installed parse-video-py and
      # musicdl) exactly as the runtime image does — the tests exercise the
      # real engine adapters' import surface.
      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          bash backend/scripts/install_f2.sh

      - name: Run backend test suite
        run: python -m pytest backend/tests -q

  frontend:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Check frontend Node engine contract
        run: npm run check:engines --prefix frontend

      - name: Test frontend Node engine checker
        run: node --test frontend/scripts/check-engines.test.mjs

      - name: Run frontend tests
        run: npm test --prefix frontend

      - name: Build production bundle
        run: npm run build --prefix frontend

  docker:
    name: Docker image build check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build the exact production image (repo-root context, backend/Dockerfile)
      # without pushing; the gha cache makes repeat builds fast. cache-to
      # failures are tolerated (cache is an optimization, not the gate).
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: koi-fetch:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
