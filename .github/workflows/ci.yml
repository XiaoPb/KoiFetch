name: CI

# Continuous integration: run the full backend + frontend test suites and
# verify the production Docker image builds. Runs on every push to main and
# on pull requests; the release workflow also calls this file as a reusable
# workflow (`workflow_call`) so a tag-triggered release only publishes after
# the same gates pass.
#
# Gates mirror the RELEASE-CHECKLIST acceptance rows:
#   - backend:  `python -m pytest backend/tests` (full engine deps installed)
#   - frontend: `npm test` (vitest) + `npm run build` (tsc + vite build)
#   - image:    `docker build -f backend/Dockerfile .` (multi-stage, no push)

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt

      # Full dependency install (incl. git-installed parse-video-py and the
      # verified compatibility wheels) exactly as the runtime image does.
      - name: Install backend dependencies
        run: python backend/scripts/install_backend_dependencies.py

      # This opt-in contract creates a separate temporary venv, reruns the
      # unified installer, and performs pip-check plus real application imports.
      - name: Verify clean dependency installation
        env:
          KOIFETCH_RUN_LIVE_INSTALL: "1"
        run: python -m pytest backend/tests/test_compatible_wheels.py -m integration -q

      - name: Run backend test suite
        run: python -m pytest backend/tests -q

  audit:
    name: Audited backend environment
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt

      # Keep pip-audit in an environment that is never used by the backend
      # tests. The wrapper enforces the exact VCS and skip-review contract.
      - name: Install backend dependencies for audit
        run: python backend/scripts/install_backend_dependencies.py --skip-smoke

      - name: Install pinned Python dependency auditor
        run: python -m pip install pip-audit==2.10.1

      - name: Audit Python dependencies
        run: python backend/scripts/audit_backend_dependencies.py

  frontend:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Audit frontend dependencies
        run: npm audit --prefix frontend --audit-level=high

      - name: Check frontend Node engine contract
        run: npm run check:engines --prefix frontend

      - name: Test frontend Node engine checker
        run: node --test frontend/scripts/check-engines.test.mjs

      - name: Run frontend tests
        run: npm test --prefix frontend

      - name: Build production bundle
        run: npm run build --prefix frontend

  docker:
    name: Docker image build check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet

      # Build the exact production image (repo-root context, backend/Dockerfile)
      # without pushing; the gha cache makes repeat builds fast. cache-to
      # failures are tolerated (cache is an optimization, not the gate).
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: koi-fetch:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
