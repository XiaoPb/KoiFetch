name: Release

# Tag-triggered release pipeline. Pushing a `v*` tag (e.g. `v0.0.1`) runs the
# full CI gates (reusable workflow above), builds the production Docker image,
# pushes it to the GitHub Container Registry, and creates a GitHub Release.
#
# Usage:
#   git tag v0.0.1
#   git push origin v0.0.1
#
# Published image: ghcr.io/<owner>/koifetch:<version> (semver without the v)
# plus the `latest` tag. The GitHub Release is created from the pushed tag
# with auto-generated release notes.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  # Re-run the same test gates before publishing anything.
  test:
    name: CI gates
    uses: ./.github/workflows/ci.yml

  publish-image:
    name: Build & publish Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute lowercase image name (GHCR requires lowercase) and version
      # tags: v0.0.1 -> 0.0.1 (semver, no leading v) + latest.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/koifetch
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  release:
    name: Create GitHub Release
    needs: publish-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
